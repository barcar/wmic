name: CodeQL

on:
  push:
    branches:
      - master
      - refactor/powershell-replace-wmic
      - copilot/refactorpowershell-replace-wmic
  pull_request:
    branches:
      - master
      - refactor/powershell-replace-wmic
  schedule:
    - cron: '18 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # Repository runtime is Node.js; JavaScript covers source and workflow-action checks.
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
