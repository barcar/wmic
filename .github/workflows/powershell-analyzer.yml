name: PowerShell Analyzer

on:
  push:
    branches:
      - master
      - "refactor/**"
      - "copilot/**"
    paths:
      - "powershell/**/*.ps1"
      - ".github/workflows/powershell-analyzer.yml"
  pull_request:
    branches:
      - master
      - "refactor/**"
    paths:
      - "powershell/**/*.ps1"
      - ".github/workflows/powershell-analyzer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (Get-Command -Name Install-PackageProvider -ErrorAction SilentlyContinue) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          }
          if (Get-Command -Name Install-Module -ErrorAction SilentlyContinue) {
            Install-Module -Name PowerShellGet -Scope CurrentUser -Force -AllowClobber
          }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          if (-not (Test-Path -Path powershell -PathType Container)) {
            Write-Host "No powershell directory found; skipping analysis."
            exit 0
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $result = Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Error,Warning
          if ($result) {
            $result | Format-Table -AutoSize
            throw "PSScriptAnalyzer found issues."
          }
