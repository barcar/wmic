name: PowerShell Analyzer

on:
  push:
    branches:
      - master
      - "refactor/**"
      - "copilot/**"
    paths:
      - "powershell/**/*.ps1"
      - ".github/workflows/powershell-analyzer.yml"
  pull_request:
    paths:
      - "powershell/**/*.ps1"
      - ".github/workflows/powershell-analyzer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PowerShell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (Get-Command -Name Install-Module -ErrorAction SilentlyContinue) {
            $powerShellGet = Get-Module -ListAvailable -Name PowerShellGet | Sort-Object Version -Descending | Select-Object -First 1
            if (-not $powerShellGet) {
              Install-Module -Name PowerShellGet -Scope CurrentUser -Force -AllowClobber
            }
          }
          $psGallery = $null
          try {
            $psGallery = Get-PSRepository -Name PSGallery -ErrorAction Stop
          } catch {
            $psGallery = $null
          }
          if (-not $psGallery) {
            Register-PSRepository -Default
          }
          if (-not (Test-Path -Path powershell -PathType Container)) {
            Write-Host "No powershell directory found; skipping analysis."
            exit 0
          }
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Repository PSGallery -Scope CurrentUser -Force
          Import-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Force
          $result = Invoke-ScriptAnalyzer -Path powershell -Recurse -Severity Error,Warning
          if ($result) {
            $result | Format-Table -AutoSize
            throw "PSScriptAnalyzer found issues."
          }
