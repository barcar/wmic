name: PowerShell Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSSCRIPTANALYZER_VERSION: 1.22.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery -RequiredVersion $env:PSSCRIPTANALYZER_VERSION

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $scripts = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:GITHUB_BASE_REF) {
            $scripts = @(git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD" -- '*.ps1' '*.psm1' '*.psd1')
          }

          if (-not $scripts) {
            $scripts = @(git ls-files '*.ps1' '*.psm1' '*.psd1')
          }

          if (-not $scripts) {
            Write-Host 'No PowerShell scripts found.'
            exit 0
          }

          $results = @($scripts | Invoke-ScriptAnalyzer -Severity Warning,Error)

          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
